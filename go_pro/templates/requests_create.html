<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>Заявка на доступ</title></head>
<body>
{{ template "userbar.html" . }}
<h1>Заявка на доступ</h1>
<p><a href="javascript:history.back()">← Назад</a></p>

<form method="POST">
  {{ if .User.IsAdmin }}
  <p>Кому:
    <select name="subject_user_id" required>
      {{ range .Users }}
        <option value="{{ .ID }}" {{ if eq .ID $.User.ID }}selected{{ end }}>{{ .Name }}</option>
      {{ end }}
    </select>
  </p>
  {{ else }}
  <p><b>Кому:</b> {{ .User.Name }} (вы)</p>
  <input type="hidden" name="subject_user_id" value="{{ .User.ID }}">
  {{ end }}

  <p>Ресурс:
    <select name="resource_type" required>
      <option value="documents" {{ if eq .Resource "documents" }}selected{{ end }}>Документы</option>
      <option value="wiki" {{ if eq .Resource "wiki" }}selected{{ end }}>Wiki</option>
      <option value="kanban" {{ if eq .Resource "kanban" }}selected{{ end }}>Канбан</option>
    </select>
  </p>

  <p>Действие:
    <select name="action" required>
      <option value="read">Чтение</option>
      <option value="create">Создание</option>
      <option value="update">Обновление</option>
      <option value="delete">Удаление</option>
    </select>
  </p>

  <p>Направление (пусто = любое):
    <input name="direction_id" type="number" min="1" placeholder="1 или 2">
  </p>

  <p>Категория (пусто = любая):
    <input name="category_id" type="number" min="1" placeholder="1..3">
  </p>

  <p>Срок (часов, пусто = бессрочно):
    <input name="expires_hours" type="number" min="1" placeholder="например 72">
  </p>

  <button type="submit">Отправить заявку</button>
</form>
</body></html>
