<div style="background:#f0f0f0;padding:10px;margin-bottom:15px;border-radius:4px;">
  <b>Вы вошли как: {{ .User.Name }}</b>
  <form method="POST" action="/switch-user" style="display:inline;margin-left:10px;">
    <select name="user_id" onchange="this.form.submit()">
      {{ range .Users }}
        <option value="{{ .ID }}" {{ if eq .ID $.User.ID }}selected{{ end }}>{{ .Name }}</option>
      {{ end }}
    </select>
  </form>
</div>
