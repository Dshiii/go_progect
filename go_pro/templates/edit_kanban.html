<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>Редактировать задачу</title></head>
<body>
{{ template "userbar.html" . }}
<h1>Редактировать задачу</h1>
<p><a href="/kanban">← Назад</a></p>
<form method="POST">
  <p>Название: <input name="title" value="{{ .Task.Title }}" required></p>

  <p>Проект:
    <select name="project_id" required>
      {{ range .Projects }}
        <option value="{{ .ID }}" {{ if eq .ID $.Task.ProjectID }}selected{{ end }}>{{ .Name }}</option>
      {{ end }}
    </select>
  </p>

  <p>Исполнитель:
    <select name="assignee_id" required>
      {{ range .Users }}
        <option value="{{ .ID }}" {{ if eq .ID $.Task.AssigneeID }}selected{{ end }}>{{ .Name }}</option>
      {{ end }}
    </select>
  </p>

  <button type="submit">Сохранить</button>
</form>
</body></html>
