<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>Редактировать документ</title></head>
<body>
{{ template "userbar.html" . }}
<h1>Редактировать документ</h1>
<p><a href="/">← Назад</a></p>
<form method="POST">
  <p>Название: <input name="title" value="{{ .Doc.Title }}" required></p>

  <p>Направление:
    <select name="direction_id" required>
      {{ range $id, $name := .Directions }}
        <option value="{{ $id }}" {{ if eq $id $.Doc.DirectionID }}selected{{ end }}>{{ $name }}</option>
      {{ end }}
    </select>
  </p>

  <p>Категория:
    <select name="category_id" required>
      {{ range $id, $name := .Categories }}
        <option value="{{ $id }}" {{ if eq $id $.Doc.CategoryID }}selected{{ end }}>{{ $name }}</option>
      {{ end }}
    </select>
  </p>

  <button type="submit">Сохранить</button>
</form>
</body></html>
