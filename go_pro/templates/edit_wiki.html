<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>Редактировать страницу Wiki</title></head>
<body>
{{ template "userbar.html" . }}
<h1>Редактировать страницу Wiki</h1>
<p><a href="/wiki">← Назад</a></p>
<form method="POST">
  <p>Заголовок: <input name="title" value="{{ .Page.Title }}" required></p>
  <p>Раздел:
    <select name="section_id" required>
      {{ range $id, $name := .Sections }}
        <option value="{{ $id }}" {{ if eq $id $.Page.SectionID }}selected{{ end }}>{{ $name }}</option>
      {{ end }}
    </select>
  </p>
  <button type="submit">Сохранить</button>
</form>
</body></html>
