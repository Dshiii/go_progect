<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>Создать страницу Wiki</title></head>
<body>
{{ template "userbar.html" . }}
<h1>Создать страницу Wiki</h1>
<p><a href="/wiki">← Назад</a></p>
<form method="POST">
  <p>Заголовок: <input name="title" required></p>
  <p>Раздел:
    <select name="section_id" required>
      {{ range $id, $name := .Sections }}
        <option value="{{ $id }}">{{ $name }}</option>
      {{ end }}
    </select>
  </p>
  <button type="submit">Создать</button>
</form>
</body></html>
